services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crypto_momentum
    ports:
      # Map to a non-default host port to avoid conflicts with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/crypto_momentum
      APP_ENV: dev
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
